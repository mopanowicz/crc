<div class="wrapper">
  <h1>Looping Timer</h1>
  <div class="inputs">
    <label>Repetitions<input type="number" min="1" [(ngModel)]="repetitions" [disabled]="running()"></label>
    <label>Activity (sec)<input type="number" min="1" [(ngModel)]="activityLength" [disabled]="running()"></label>
    <label>Rest (sec)<input type="number" min="0" [(ngModel)]="restLength" [disabled]="running()"></label>
  </div>

  <div class="display" [class.activity]="phase() === 'activity'" [class.rest]="phase() === 'rest'" [class.done]="phase() === 'done'">
    <div class="phase">{{ phase() | uppercase }}</div>
    <div class="big">{{ currentTime() }}s</div>
    <div class="meta">Rep {{ currentRep() }} / {{ repetitions }}</div>
    <div class="progress"><div class="bar" [style.width.%]="progress()"></div></div>
  </div>

  <div class="controls">
    <button (click)="start()" [disabled]="running()">Start</button>
    <button (click)="pause()" [disabled]="!running()">Pause</button>
    <button (click)="reset()">Reset</button>
  </div>
</div>
